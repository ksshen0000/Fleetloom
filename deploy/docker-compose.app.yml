# The whole platform in containers, on top of the infrastructure in docker-compose.yml.
#
#   deploy/docker/build.sh                      # jars, web build, images
#   RCS_JWT_SECRET=... RCS_ADMIN_PASSWORD=... \
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.app.yml up -d
#   # with two simulated vehicles on the DEMO map:  ... --profile sim up -d
#
# Only the web console is published (RCS_HTTP_PORT, default 8000); the services talk to each other
# on the compose network and are reached from outside through nginx -> rcs-gateway.
x-service: &service
  restart: unless-stopped
  environment: &env
    RCS_DB_HOST: postgres
    RCS_VALKEY_HOST: valkey
    RCS_MQTT_HOST: mosquitto
    RCS_RESOURCE_URL: http://resource:8081
    RCS_DISPATCH_URL: http://dispatch:8082
    RCS_FLEET_URL: http://fleet:8083
    RCS_TRAFFIC_URL: http://traffic:8084
    RCS_SIMULATOR_URL: http://simulator:8090
    RCS_JWT_SECRET: ${RCS_JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
  depends_on: &infra
    postgres:
      condition: service_healthy
    valkey:
      condition: service_healthy
    mosquitto:
      condition: service_started

x-health: &health
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 10s

services:
  resource:
    <<: *service
    image: rcs3000/resource:${RCS_VERSION:-dev}
    build: { context: .., dockerfile: deploy/docker/service.Dockerfile, args: { JAR: rcs-resource/target/rcs-resource-0.1.0-SNAPSHOT.jar } }
    environment:
      <<: *env
      RCS_ADMIN_PASSWORD: ${RCS_ADMIN_PASSWORD:-admin12345}
    healthcheck: { <<: *health, test: ["CMD", "bash", "-c", "</dev/tcp/localhost/8081"] }

  fleet:
    <<: *service
    image: rcs3000/fleet:${RCS_VERSION:-dev}
    build: { context: .., dockerfile: deploy/docker/service.Dockerfile, args: { JAR: rcs-fleet/target/rcs-fleet-0.1.0-SNAPSHOT-exec.jar } }
    healthcheck: { <<: *health, test: ["CMD", "bash", "-c", "</dev/tcp/localhost/8083"] }

  traffic:
    <<: *service
    image: rcs3000/traffic:${RCS_VERSION:-dev}
    build: { context: .., dockerfile: deploy/docker/service.Dockerfile, args: { JAR: rcs-traffic/target/rcs-traffic-0.1.0-SNAPSHOT-exec.jar } }
    depends_on:
      <<: *infra
      resource: { condition: service_healthy }
      fleet: { condition: service_healthy }
    healthcheck: { <<: *health, test: ["CMD", "bash", "-c", "</dev/tcp/localhost/8084"] }

  dispatch:
    <<: *service
    image: rcs3000/dispatch:${RCS_VERSION:-dev}
    build: { context: .., dockerfile: deploy/docker/service.Dockerfile, args: { JAR: rcs-dispatch/target/rcs-dispatch-0.1.0-SNAPSHOT.jar } }
    depends_on:
      <<: *infra
      resource: { condition: service_healthy }
      traffic: { condition: service_healthy }
    healthcheck: { <<: *health, test: ["CMD", "bash", "-c", "</dev/tcp/localhost/8082"] }

  gateway:
    <<: *service
    image: rcs3000/gateway:${RCS_VERSION:-dev}
    build: { context: .., dockerfile: deploy/docker/service.Dockerfile, args: { JAR: rcs-gateway/target/rcs-gateway-0.1.0-SNAPSHOT.jar } }
    healthcheck: { <<: *health, test: ["CMD", "bash", "-c", "</dev/tcp/localhost/8080"] }

  web:
    image: rcs3000/web:${RCS_VERSION:-dev}
    build: { context: .., dockerfile: deploy/docker/web.Dockerfile }
    restart: unless-stopped
    depends_on:
      gateway: { condition: service_healthy }
    ports:
      - "${RCS_HTTP_PORT:-8000}:80"

  simulator:
    <<: *service
    profiles: [sim]
    image: rcs3000/simulator:${RCS_VERSION:-dev}
    build: { context: .., dockerfile: deploy/docker/service.Dockerfile, args: { JAR: rcs-simulator/target/rcs-simulator-0.1.0-SNAPSHOT-exec.jar } }
    depends_on:
      <<: *infra
      resource: { condition: service_healthy }
    command:
      - --rcs.simulator.map.code=${RCS_SIM_MAP:-DEMO}
      - --rcs.simulator.vehicles[0].serial-number=AGV-001
      - --rcs.simulator.vehicles[0].initial-point=P10
      - --rcs.simulator.vehicles[1].serial-number=AGV-002
      - --rcs.simulator.vehicles[1].initial-point=P01
