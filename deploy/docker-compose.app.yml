# The whole platform in containers, on top of the infrastructure in docker-compose.yml.
#
#   deploy/docker/build.sh                      # jars, web build, images
#   FLEETLOOM_JWT_SECRET=... FLEETLOOM_ADMIN_PASSWORD=... \
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.app.yml up -d
#   # with two simulated vehicles on the DEMO map:  ... --profile sim up -d
#
# Only the web console is published (FLEETLOOM_HTTP_PORT, default 8000); the services talk to each other
# on the compose network and are reached from outside through nginx -> fleetloom-gateway.
x-service: &service
  restart: unless-stopped
  environment: &env
    FLEETLOOM_DB_HOST: postgres
    FLEETLOOM_VALKEY_HOST: valkey
    FLEETLOOM_MQTT_HOST: mosquitto
    FLEETLOOM_RESOURCE_URL: http://resource:8081
    FLEETLOOM_DISPATCH_URL: http://dispatch:8082
    FLEETLOOM_FLEET_URL: http://fleet:8083
    FLEETLOOM_TRAFFIC_URL: http://traffic:8084
    FLEETLOOM_SIMULATOR_URL: http://simulator:8090
    FLEETLOOM_JWT_SECRET: ${FLEETLOOM_JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
  depends_on: &infra
    postgres:
      condition: service_healthy
    valkey:
      condition: service_healthy
    mosquitto:
      condition: service_started

x-health: &health
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 10s

services:
  resource:
    <<: *service
    image: fleetloom/resource:${FLEETLOOM_VERSION:-dev}
    build: { context: .., dockerfile: deploy/docker/service.Dockerfile, args: { JAR: fleetloom-resource/target/fleetloom-resource-0.1.0-SNAPSHOT.jar } }
    environment:
      <<: *env
      FLEETLOOM_ADMIN_PASSWORD: ${FLEETLOOM_ADMIN_PASSWORD:-admin12345}
    healthcheck: { <<: *health, test: ["CMD", "bash", "-c", "</dev/tcp/localhost/8081"] }

  fleet:
    <<: *service
    image: fleetloom/fleet:${FLEETLOOM_VERSION:-dev}
    build: { context: .., dockerfile: deploy/docker/service.Dockerfile, args: { JAR: fleetloom-fleet/target/fleetloom-fleet-0.1.0-SNAPSHOT-exec.jar } }
    healthcheck: { <<: *health, test: ["CMD", "bash", "-c", "</dev/tcp/localhost/8083"] }

  traffic:
    <<: *service
    image: fleetloom/traffic:${FLEETLOOM_VERSION:-dev}
    build: { context: .., dockerfile: deploy/docker/service.Dockerfile, args: { JAR: fleetloom-traffic/target/fleetloom-traffic-0.1.0-SNAPSHOT-exec.jar } }
    depends_on:
      <<: *infra
      resource: { condition: service_healthy }
      fleet: { condition: service_healthy }
    healthcheck: { <<: *health, test: ["CMD", "bash", "-c", "</dev/tcp/localhost/8084"] }

  dispatch:
    <<: *service
    image: fleetloom/dispatch:${FLEETLOOM_VERSION:-dev}
    build: { context: .., dockerfile: deploy/docker/service.Dockerfile, args: { JAR: fleetloom-dispatch/target/fleetloom-dispatch-0.1.0-SNAPSHOT.jar } }
    depends_on:
      <<: *infra
      resource: { condition: service_healthy }
      traffic: { condition: service_healthy }
    healthcheck: { <<: *health, test: ["CMD", "bash", "-c", "</dev/tcp/localhost/8082"] }

  gateway:
    <<: *service
    image: fleetloom/gateway:${FLEETLOOM_VERSION:-dev}
    build: { context: .., dockerfile: deploy/docker/service.Dockerfile, args: { JAR: fleetloom-gateway/target/fleetloom-gateway-0.1.0-SNAPSHOT.jar } }
    healthcheck: { <<: *health, test: ["CMD", "bash", "-c", "</dev/tcp/localhost/8080"] }

  web:
    image: fleetloom/web:${FLEETLOOM_VERSION:-dev}
    build: { context: .., dockerfile: deploy/docker/web.Dockerfile }
    restart: unless-stopped
    depends_on:
      gateway: { condition: service_healthy }
    ports:
      - "${FLEETLOOM_HTTP_PORT:-8000}:80"

  simulator:
    <<: *service
    profiles: [sim]
    image: fleetloom/simulator:${FLEETLOOM_VERSION:-dev}
    build: { context: .., dockerfile: deploy/docker/service.Dockerfile, args: { JAR: fleetloom-simulator/target/fleetloom-simulator-0.1.0-SNAPSHOT-exec.jar } }
    depends_on:
      <<: *infra
      resource: { condition: service_healthy }
    command:
      - --fleetloom.simulator.map.code=${FLEETLOOM_SIM_MAP:-DEMO}
      - --fleetloom.simulator.vehicles[0].serial-number=AGV-001
      - --fleetloom.simulator.vehicles[0].initial-point=P10
      - --fleetloom.simulator.vehicles[1].serial-number=AGV-002
      - --fleetloom.simulator.vehicles[1].initial-point=P01
