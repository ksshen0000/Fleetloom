server:
  port: ${RCS_DISPATCH_PORT:8082}

spring:
  application:
    name: rcs-dispatch
  datasource:
    url: jdbc:postgresql://${RCS_DB_HOST:localhost}:${RCS_DB_PORT:5432}/${RCS_DB_NAME:rcs}?currentSchema=dispatch&stringtype=unspecified
    username: ${RCS_DISPATCH_DB_USER:rcs_dispatch}
    password: ${RCS_DISPATCH_DB_PASSWORD:rcs_dispatch}
  flyway:
    schemas: dispatch
    default-schema: dispatch
    create-schemas: true
  data:
    redis:
      host: ${RCS_VALKEY_HOST:localhost}
      port: ${RCS_VALKEY_PORT:6379}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

rcs:
  dispatch:
    resource-url: ${RCS_RESOURCE_URL:http://localhost:8081}
    traffic-url: ${RCS_TRAFFIC_URL:http://localhost:8084}
    fleet-url: ${RCS_FLEET_URL:http://localhost:8083}
    # order status callbacks to the upstream system (DSP-11); empty URL = off
    callback:
      url: ${RCS_ORDER_CALLBACK_URL:}
      secret: ${RCS_ORDER_CALLBACK_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
