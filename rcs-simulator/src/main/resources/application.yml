server:
  port: ${RCS_SIMULATOR_PORT:8090}

spring:
  application:
    name: rcs-simulator

rcs:
  simulator:
    mqtt:
      host: ${RCS_MQTT_HOST:localhost}
      port: ${RCS_MQTT_PORT:1883}
    map:
      resource-url: ${RCS_RESOURCE_URL:http://localhost:8081}
      # Map to load; leave empty to run without one (orders then need node positions)
      code: ${RCS_SIM_MAP:}
    # Vehicles started with the simulator. Place them on a map point or at x/y.
    vehicles:
      - serial-number: AGV-001
        x: 0
        y: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
