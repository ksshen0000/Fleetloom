server:
  port: ${RCS_TRAFFIC_PORT:8084}

spring:
  application:
    name: rcs-traffic
  data:
    redis:
      host: ${RCS_VALKEY_HOST:localhost}
      port: ${RCS_VALKEY_PORT:6379}

rcs:
  traffic:
    fleet-url: ${RCS_FLEET_URL:http://localhost:8083}
    resource-url: ${RCS_RESOURCE_URL:http://localhost:8081}
    lookahead-nodes: 3
    lookahead-distance: 5.0
    replan-after: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
