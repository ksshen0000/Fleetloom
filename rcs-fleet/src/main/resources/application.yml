server:
  port: ${RCS_FLEET_PORT:8083}

spring:
  application:
    name: rcs-fleet
  data:
    redis:
      host: ${RCS_VALKEY_HOST:localhost}
      port: ${RCS_VALKEY_PORT:6379}

rcs:
  fleet:
    mqtt:
      host: ${RCS_MQTT_HOST:localhost}
      port: ${RCS_MQTT_PORT:1883}
    heartbeat-timeout: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
