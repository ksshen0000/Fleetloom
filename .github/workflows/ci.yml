name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Unit, slice, architecture and Testcontainers integration tests; -fae runs every module, so one
      # failure does not hide the others
      - name: Build and test
        run: ./mvnw -B -ntp -fae verify
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: '**/target/surefire-reports/'
      - name: License check and SBOM
        run: ./mvnw -B -ntp -Plicense-check verify -DskipTests
      - uses: actions/upload-artifact@v5
        with:
          name: sbom
          path: '**/target/classes/META-INF/sbom/*.cdx.json'

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Every commit is signed off (DCO)
        run: |
          missing=$(git log --format='%H %(trailers:key=Signed-off-by,valueonly)' \
            origin/${{ github.base_ref }}..HEAD | awk 'NF==1 {print $1}')
          if [ -n "$missing" ]; then
            echo "Commits without Signed-off-by (use git commit -s):"; echo "$missing"; exit 1
          fi
